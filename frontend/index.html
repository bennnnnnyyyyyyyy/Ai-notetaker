<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prime Ad Meeting Intelligence</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <nav class="sidebar">
    <div class="logo">
      <span class="logo-mark">PA</span>
      <span class="logo-text">Meeting Intel</span>
    </div>
    <ul class="nav-links">
      <li><a href="#" class="nav-link active" data-view="dashboard">Dashboard</a></li>
      <li><a href="#" class="nav-link" data-view="meetings">Meetings</a></li>
      <li><a href="#" class="nav-link" data-view="new-meeting">+ New Meeting</a></li>
      <li><a href="#" class="nav-link" data-view="campaigns">Campaigns</a></li>
    </ul>
  </nav>

  <main class="main">

    <!-- ── Dashboard ────────────────────────────────────────────── -->
    <section id="view-dashboard" class="view active">
      <h1>Dashboard</h1>
      <div class="stat-grid" id="stat-grid">
        <div class="stat-card"><div class="stat-val" id="stat-total">—</div><div class="stat-label">Total meetings</div></div>
        <div class="stat-card"><div class="stat-val" id="stat-processing">—</div><div class="stat-label">Processing</div></div>
        <div class="stat-card"><div class="stat-val" id="stat-completed">—</div><div class="stat-label">Completed</div></div>
        <div class="stat-card"><div class="stat-val" id="stat-failed">—</div><div class="stat-label">Failed</div></div>
      </div>
      <div class="form-card readiness-card">
        <div class="section-heading"><h2>Local capture readiness</h2><button class="btn-secondary" id="refresh-readiness">Refresh</button></div>
        <div id="readiness" class="muted">Checking this PC…</div>
      </div>
      <h2>Recent Meetings</h2>
      <div id="recent-meetings" class="meeting-list"></div>
    </section>

    <!-- ── Meetings list ─────────────────────────────────────────── -->
    <section id="view-meetings" class="view">
      <h1>Meetings</h1>
      <div id="meetings-list" class="meeting-list"></div>
    </section>

    <!-- ── New meeting form ──────────────────────────────────────── -->
    <section id="view-new-meeting" class="view">
      <h1>Register Meeting</h1>
      <form id="new-meeting-form" class="form-card">
        <label>Google Meet URL *
          <input id="f-url" type="url" required placeholder="https://meet.google.com/xxx-xxxx-xxx" />
        </label>
        <label>Meeting Type *
          <select id="f-type" required>
            <option value="discovery">Sales / Discovery</option>
            <option value="negotiation">Deal Negotiation</option>
            <option value="onboarding">Client Onboarding</option>
          </select>
        </label>
        <label>Campaign
          <select id="f-campaign">
            <option value="">— None —</option>
          </select>
        </label>
        <label>Opener Name
          <input id="f-opener" type="text" placeholder="e.g. James" />
        </label>
        <label>Closer Name
          <input id="f-closer" type="text" placeholder="e.g. Ben" />
        </label>
        <label>Scheduled At (optional)
          <input id="f-scheduled" type="datetime-local" />
        </label>
        <label>Pre-booking Notes
          <textarea id="f-notes" rows="3" placeholder="What the opener established before this meeting…"></textarea>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Register & Start Capture</button>
        </div>
        <p id="form-error" class="form-error hidden"></p>
      </form>
    </section>

    <!-- ── Meeting detail / report ──────────────────────────────── -->
    <section id="view-meeting-detail" class="view">
      <button class="btn-back" id="back-btn">← Back</button>
      <div id="detail-content"></div>
    </section>

    <!-- ── Campaigns ────────────────────────────────────────────── -->
    <section id="view-campaigns" class="view">
      <h1>Campaigns</h1>
      <div id="campaigns-list" class="meeting-list"></div>
    </section>

  </main>

  <script src="/static/app.js"></script>
</body>
</html>
